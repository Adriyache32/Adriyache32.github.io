<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}

.row.in .rh::after{transform:scaleX(var(--p))}
.rv{opacity:0;transform:translateY(18px) scale(.98);filter:blur(6px);transition:opacity .7s cubic-bezier(.2,.9,.2,1),transform .7s cubic-bezier(.2,.9,.2,1),filter .7s cubic-bezier(.2,.9,.2,1),border-color .3s,box-shadow .3s}
.rv.in{opacity:1;transform:none;filter:none}
.pop>*{animation:pin .55s cubic-bezier(.2,.9,.2,1) both}
@keyframes pin{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
.sh .rw{position:relative;width:52px;height:52px;flex:none}
.ring{width:52px;height:52px;transform:rotate(-90deg)}
.rt{fill:none;stroke:#ffffff14;stroke-width:5}
.rf{fill:none;stroke:url(#rg);stroke-width:5;stroke-linecap:round;stroke-dasharray:138.2;stroke-dashoffset:138.2;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.9,.2,1)}
.sh .rl{position:absolute;inset:0;display:grid;place-items:center;font:800 13px Sora,sans-serif;color:var(--tx)}
.sh .sn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.sh .sn span{font-size:12px}
.sh .sv{margin-left:auto;font:800 15px Sora,sans-serif;color:var(--cy);text-align:right}
.cf{position:fixed;width:7px;height:11px;border-radius:2px;pointer-events:none;z-index:9}
.sb{display:none}
@supports (animation-timeline:scroll()){.sb{display:block;position:fixed;top:0;left:0;right:0;height:3px;z-index:9;transform-origin:left;background:linear-gradient(90deg,var(--vi),var(--cy),var(--au));animation:sbar linear;animation-timeline:scroll()}@keyframes sbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s}
:root{--win:#4cc2ff;--mint:#87cf3e;--edos:#b58cff;--and:#3ddc84}.i.f{fill:currentColor;stroke:none}.oi{display:inline-flex;vertical-align:-2px;margin-left:6px;font-size:14px}
</style>

<script>
const I=n=>`<svg class="i${/^win/.test(n)?' f':''}" aria-hidden="true"><use href="#${n}"/></svg>`;
const BG={oc:['bolt','Overclock','--au'],dual:['ram','Dual-Channel','--cy'],single:['warn','Single-Channel','--ro'],linux:['term','Linux Mint','--gr'],root:['shield','Root','--vi'],deg:['shield','De-Googled','--vi'],rom:['layers','LineageOS','--vi'],debl:['minus','Debloat','--cy'],game:['pad','Game Mode','--cy'],stock:['check','Stock','--mu'],desk:['desk','Escritorio','--mu'],tab:['tab','Tablet','--mu']};
const chip=(i,t,c,z)=>`<span class="bg${z?' sm':''}" style="--c:var(${c})">${I(i)}${t}</span>`;
const auto=x=>{const t=x.sp.map(p=>p[1]).join(' | ')+' '+x.d,a=[];let m;
if(m=t.match(/Zen \d/))a.push(['cpu',m[0],'--cy']);
if(/Skylake/.test(t))a.push(['cpu','Skylake','--cy']);
if(/DDR5/.test(t))a.push(['ram','DDR5','--cy']);
if(m=t.match(/PCIe [\d.]+|NVMe/))a.push(['ssd',m[0],'--cy']);
if(m=t.match(/(\d+)W\b/))a.push(['bolt',m[1]+' W','--mu']);
if(m=t.match(/(\d+)nm/))a.push(['cpu',m[1]+' nm','--cy']);
if(/5G/.test(t))a.push(['signal','5G','--gr']);
if(m=t.match(/UFS [\d.]+|eMMC [\d.]+/))a.push(['ssd',m[0],'--mu']);
if(m=t.match(/(\d+)Hz/))a.push(['screen',m[1]+' Hz','--ro']);
if(/microG/.test(t))a.push(['shield','microG','--vi']);
if(/de fábrica/.test(t))a.push(['bolt','OC de fábrica','--au']);
return a};
const OS={win:['win11','Windows','--win'],w10:['win10','Windows 10','--win'],w11:['win11','Windows 11','--win'],mint:['mint','Linux Mint','--mint'],edos:['edos','EndeavourOS','--edos'],and:['and','Android','--and'],los:['and','LineageOS','--and']};
const OSM={'Mateo|ACEMAGIC AM18':'win','Mellado|PC Desktop Ryzen 5':'w10','Adriel|Lenovo IdeaPad 3':'edos','Diego|IdeaPad Slim 3':'win','Eliezer|LAPTOP-DLQU141U':'win','Sergio|Portátil Linux Mint':'mint','Adriel|Moto G71 5G':'los','Adriel|Redmi Note 9 Pro':'los'};
Object.values(D).forEach(S=>S.items.forEach(x=>x.os=OSM[x.n+'|'+x.d]||'and'));
const oi=x=>`<span class="oi" style="color:var(${OS[x.os][2]})" title="${OS[x.os][1]}">${I(OS[x.os][0])}</span>`;
const B=(x,z)=>[chip(...OS[x.os],z),...x.b.filter(k=>(!z||k!=='stock')&&!(k==='rom'&&x.os==='los')&&!(k==='linux'&&x.os==='mint')).map(k=>{const[b,t,c]=BG[k];return chip(b,t,c,z)}),...auto(x).map(a=>chip(a[0],a[1],a[2],z))];
const pc=(n,d,s,cpu,gpu,ram,ssd,m,b,ic)=>({n,d,s,b,ic:ic||'laptop',sp:[['cpu',cpu],['gpu',gpu],['ram',ram],['ssd',ssd]],bars:[['CPU',m[0],40],['RAM',m[1],25],['GPU',m[2],27],['SSD',m[3],15]].map(x=>[x[0],x[1]/x[2],x[1]])});
const ph=(n,d,s,v,soc,gpu,st,sw,b,ic)=>({n,d,s,b,ic:ic||'phone',sp:[['cpu',soc],['gpu',gpu],['ssd',st],['layers',sw]],bars:[['v11',s/665,s+'k'],['v10',v/665,'~'+v+'k']]});

const PC=['--au','--ag','--cu'],CC=['#5ee6a8','#38d5ff','#8b6cff','#ff8fd0','#ffb36b','#7ee0e0','#b6a8ff'];
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let tab='pc',sel=0;
const det=x=>`<div class="dt"><div class="bgs">${B(x).join('')}</div><div class="sps">${x.sp.map(s=>`<div class="sp">${I(s[0])}<span>${s[1]}</span></div>`).join('')}</div>${x.bars.map(b=>`<div class="bar"><span>${b[0]}</span><div class="trk"><div class="fl" data-w="${(b[1]*100).toFixed(1)}"></div></div><b>${b[2]}</b></div>`).join('')}</div>`;
const fill=el=>requestAnimationFrame(()=>requestAnimationFrame(()=>{el.querySelectorAll('.fl').forEach(f=>f.style.width=f.dataset.w+'%');el.querySelectorAll('.rf').forEach(f=>f.style.strokeDashoffset=138.2*(1-f.dataset.r))}));
const cnt=(e,sfx)=>{const t=+e.dataset.n;if(rm){e.textContent=t+sfx;return}const t0=performance.now();const f=n=>{const p=Math.min(1,(n-t0)/1200);e.textContent=Math.round(t*(1-Math.pow(1-p,3)))+sfx;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)};
const spot=S=>{const x=S.items[sel],r=(x.s/S.items[0].s).toFixed(3);return`<div class="sh"><div class="rw"><svg class="ring" viewBox="0 0 52 52"><circle class="rt" cx="26" cy="26" r="22"/><circle class="rf" data-r="${r}" cx="26" cy="26" r="22"/></svg><span class="rl">${sel+1}°</span></div><div class="sn"><b>${x.n}${oi(x)}</b><span>${x.d}</span></div><span class="sv">${x.s}${S.sfx} ${S.u}</span></div>${det(x)}`};
function render(){
const S=D[tab],L=S.items,v=document.getElementById('view');
const pod=[1,0,2].map(i=>{const x=L[i];return`<button class="pk r${i+1}" data-i="${i}" aria-pressed="${i===sel}" style="--c:var(${PC[i]});--h:${[132,100,78][i]}px;--d:${[.35,.15,.55][i]}s">${i===0?`<span class="cr">${I('crown')}</span>`:''}<span class="av">${x.n[0]}</span><b>${x.n}${oi(x)}</b><span class="dv">${x.d}</span><span class="blk"><span class="num">${i+1}°</span><em data-n="${x.s}">0</em><small>${S.u}</small></span></button>`}).join('');
const rows=L.slice(3).map((x,k)=>`<div class="row rv" style="--c:${CC[k%CC.length]};--p:${(x.s/L[0].s).toFixed(3)};--i:${k}"><button class="rh" aria-expanded="false"><span class="rn">${k+4}</span><span class="ti"><b>${x.n}${oi(x)}</b><small>${I(x.ic)}${x.d}</small><span class="mb">${B(x,1).slice(0,4).join('')}</span></span><span class="sc"><em data-n="${x.s}">0</em><small>${S.u}</small></span>${I('chev')}</button><div class="rb"><div>${det(x)}</div></div></div>`).join('');
v.innerHTML=`<div class="stats"><div class="st">${I('bolt')}<div><em>${S.tot}</em><small>Poder combinado</small></div></div><div class="st">${I(S.ic)}<div><em>${L.length}</em><small>Equipos</small></div></div></div><div class="pod">${pod}</div><div class="spot" id="spot">${spot(S)}</div>${rows}`;
v.querySelectorAll('[data-n]').forEach(e=>cnt(e,S.sfx));
fill(document.getElementById('spot'));v.querySelectorAll('.rv').forEach(r=>io.observe(r));
v.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;if(sel===0)boom(b);v.querySelectorAll('.pk').forEach(p=>p.setAttribute('aria-pressed',p===b));const s=document.getElementById('spot');s.innerHTML=spot(S);s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');fill(s)});
v.querySelectorAll('.row').forEach(r=>r.querySelector('.rh').onclick=e=>{const o=r.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o);if(o)fill(r)});
}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.t===tab)return;tab=b.dataset.t;sel=0;const t=document.getElementById('tabs');t.dataset.t=tab;t.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));swap()};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
const swap=()=>{if(!rm&&document.startViewTransition){try{document.startViewTransition(render);return}catch(e){}}render()};
const boom=b=>{if(rm)return;const r=b.getBoundingClientRect(),cs=['#ffc857','#8b6cff','#38d5ff','#ff6b8a','#5ee6a8'];for(let i=0;i<22;i++){const p=document.createElement('i');p.className='cf';p.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+30}px;background:${cs[i%5]}`;document.body.appendChild(p);const a=Math.random()*Math.PI*2,d=60+Math.random()*110;p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+90}px) rotate(${Math.random()*540}deg) scale(.6)`,opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.15,.8,.3,1)'}).onfinish=()=>p.remove()}};
addEventListener('pointermove',e=>{const q=e.target.closest?e.target:null;if(!q)return;const t=q.closest('.row,.spot,.st');if(t){const r=t.getBoundingClientRect();t.style.setProperty('--mx',e.clientX-r.left+'px');t.style.setProperty('--my',e.clientY-r.top+'px')}const k=q.closest('.pk');if(k){const r=k.getBoundingClientRect();k.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*14+'deg');k.style.setProperty('--rx',(.5-(e.clientY-r.top)/r.height)*10+'deg')}});
addEventListener('pointerout',e=>{const k=e.target.closest?e.target.closest('.pk'):null;if(k&&!k.contains(e.relatedTarget)){k.style.setProperty('--rx','0deg');k.style.setProperty('--ry','0deg')}});
render();
</script>
